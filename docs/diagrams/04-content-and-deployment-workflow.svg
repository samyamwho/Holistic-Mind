<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Holistic Mind Content Management and Deployment Workflow</title>
  <desc id="desc">Flow showing how administrators manage content and how local content is safely promoted into the production Railway database and R2 storage.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4E352D" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12z" fill="#805C55"/></marker>
    <style>.title{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}.k{font:800 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:1.5px;fill:#9A5B6A}.h{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.p{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7E665D}.flow{fill:none;stroke:#805C55;stroke-width:3;marker-end:url(#arrow)}.dashed{fill:none;stroke:#9A7B70;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}.label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#805C55}.caption{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}</style>
  </defs>
  <rect width="1600" height="1050" fill="#FAF5EC"/><circle cx="1510" cy="80" r="190" fill="#F1E5D3" opacity=".55"/><circle cx="80" cy="1020" r="210" fill="#DDE6D7" opacity=".48"/>
  <text x="70" y="68" class="title">Content Management and Deployment Workflow</text><text x="70" y="104" class="subtitle">How content is authored, stored, published, promoted, and delivered without moving personal user data</text>

  <text x="70" y="166" class="k">A · DAY-TO-DAY CONTENT MANAGEMENT</text>
  <rect x="70" y="200" width="300" height="155" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="100" y="239" class="h">Authorised Administrator</text><text x="100" y="269" class="p">Exercise · audio · course</text><text x="100" y="293" class="p">module · chapter · PDF · quiz</text><text x="100" y="327" class="label">Vercel dashboard</text>
  <rect x="490" y="200" width="300" height="155" rx="28" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="520" y="239" class="h">Protected Admin API</text><text x="520" y="269" class="p">Validate metadata and status</text><text x="520" y="293" class="p">Issue temporary upload URLs</text><text x="520" y="327" class="label">ADMIN_API_KEY required</text>
  <rect x="910" y="200" width="270" height="155" rx="28" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/><text x="940" y="239" class="h">PostgreSQL</text><text x="940" y="269" class="p">Titles · descriptions · order</text><text x="940" y="293" class="p">status · tags · associations</text><text x="940" y="327" class="label">Structured metadata</text>
  <rect x="1290" y="200" width="240" height="155" rx="28" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="1320" y="239" class="h">Object Storage</text><text x="1320" y="269" class="p">Images · audio · video</text><text x="1320" y="293" class="p">covers · PDFs</text><text x="1320" y="327" class="label">MinIO locally / R2 live</text>
  <path d="M370 278H480" class="flow"/><text x="391" y="261" class="label">CRUD</text><path d="M790 260H900" class="flow"/><text x="809" y="243" class="label">Metadata</text><path d="M790 310C970 405 1240 400 1340 365" class="dashed"/><text x="1000" y="399" class="label">Signed direct upload</text>

  <rect x="530" y="430" width="540" height="105" rx="26" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="560" y="467" class="h">Published Content API</text><text x="560" y="496" class="p">Only published exercises, courses, modules, chapters and attachments are exposed to the mobile app</text>
  <path d="M1045 355V420" class="flow"/>

  <text x="70" y="632" class="k">B · SAFE LOCAL-TO-PRODUCTION CONTENT PROMOTION</text>
  <rect x="70" y="670" width="260" height="170" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="100" y="708" class="h">Local Content</text><text x="100" y="738" class="p">PostgreSQL records plus</text><text x="100" y="762" class="p">referenced MinIO objects</text><rect x="100" y="788" width="166" height="28" rx="14" fill="#E7EEE2"/><text x="119" y="807" class="label">DEVELOPMENT</text>
  <rect x="390" y="670" width="260" height="170" rx="28" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="420" y="708" class="h">Export Bundle</text><text x="420" y="738" class="p">Seven managed content tables</text><text x="420" y="762" class="p">plus every referenced asset</text><text x="420" y="798" class="label">Validate missing files</text>
  <rect x="710" y="670" width="260" height="170" rx="28" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="740" y="708" class="h">Protected Transfer</text><text x="740" y="738" class="p">Railway environment values</text><text x="740" y="762" class="p">and temporary database tunnel</text><text x="740" y="798" class="label">No secrets in the bundle</text>
  <rect x="1030" y="670" width="260" height="170" rx="28" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/><text x="1060" y="708" class="h">Production Import</text><text x="1060" y="738" class="p">Upsert matching content</text><text x="1060" y="762" class="p">Upload media into R2</text><text x="1060" y="798" class="label">Transactional database write</text>
  <rect x="1350" y="670" width="180" height="170" rx="28" fill="#E6E4F1" stroke="#B9B5D0" stroke-width="2" filter="url(#shadow)"/><text x="1380" y="708" class="h">Live App</text><text x="1380" y="738" class="p">Refreshes current</text><text x="1380" y="762" class="p">published content</text><text x="1380" y="798" class="label">Beta users</text>
  <path d="M330 755H380" class="flow"/><path d="M650 755H700" class="flow"/><path d="M970 755H1020" class="flow"/><path d="M1290 755H1340" class="flow"/>

  <rect x="270" y="900" width="1060" height="78" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2"/><text x="310" y="932" class="k">PRIVACY BOUNDARY</text><text x="310" y="958" class="p">Users, passwords, sessions, verification tokens, journals, check-ins and personal history are intentionally excluded from content bundles.</text>
  <path d="M800 840V890" class="dashed"/>
  <text x="70" y="1022" class="caption">Figure 4. Content administration and promotion workflow. Content and media move between environments; private user-owned data does not.</text>
</svg>
