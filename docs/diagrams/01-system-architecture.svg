<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Holistic Mind System Architecture</title>
  <desc id="desc">Architecture showing the mobile app, admin dashboard, backend API, PostgreSQL, recommendation service, object storage, and email provider.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4E352D" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#805C55"/></marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}.section{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#9A5B6A}.box-title{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.box-copy{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#795F56}.tag{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#76524D}.label{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#805C55}.small{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}.flow{fill:none;stroke:#805C55;stroke-width:3;marker-end:url(#arrow)}.flow-dashed{fill:none;stroke:#9A7B70;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FAF5EC"/>
  <circle cx="1450" cy="80" r="170" fill="#E8C9C9" opacity="0.28"/><circle cx="110" cy="930" r="230" fill="#DDE6D7" opacity="0.42"/>
  <text x="80" y="72" class="title">Holistic Mind System Architecture</text>
  <text x="80" y="108" class="subtitle">Cross-platform mobile experience, protected cloud services, and scalable content delivery</text>

  <rect x="510" y="150" width="580" height="150" rx="30" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="542" y="183" width="76" height="76" rx="22" fill="#EFDADF"/>
  <path d="M565 203h30a7 7 0 0 1 7 7v36a7 7 0 0 1-7 7h-30a7 7 0 0 1-7-7v-36a7 7 0 0 1 7-7zm9 43h12" fill="none" stroke="#8B5663" stroke-width="4" stroke-linecap="round"/>
  <text x="645" y="205" class="section">USER EXPERIENCE</text><text x="645" y="240" class="box-title">iOS and Android Mobile App</text><text x="645" y="270" class="box-copy">Home · Explore · Journal · Library · Profile</text>

  <rect x="75" y="365" width="360" height="175" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/>
  <text x="108" y="407" class="section">CONTENT OPERATIONS</text><text x="108" y="443" class="box-title">Admin Dashboard</text><text x="108" y="474" class="box-copy">Exercises, audio, courses, modules,</text><text x="108" y="500" class="box-copy">chapters, PDFs and publishing status</text><rect x="108" y="516" width="92" height="28" rx="14" fill="#EFE4D5"/><text x="130" y="535" class="tag">VERCEL</text>

  <rect x="510" y="355" width="580" height="205" rx="32" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="548" y="401" class="section">APPLICATION CORE</text><text x="548" y="440" class="box-title">Node.js / Express API</text><text x="548" y="474" class="box-copy">Authentication · Wellness data · Content APIs</text><text x="548" y="501" class="box-copy">Recommendations · Media signing · Admin protection</text><rect x="548" y="519" width="105" height="28" rx="14" fill="#FFF8EE"/><text x="571" y="538" class="tag">RAILWAY</text>

  <rect x="1165" y="365" width="360" height="175" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/>
  <text x="1198" y="407" class="section">COMMUNICATION</text><text x="1198" y="443" class="box-title">Email Delivery</text><text x="1198" y="474" class="box-copy">Verification and password-reset</text><text x="1198" y="500" class="box-copy">messages through Resend</text>

  <path d="M800 300 V345" class="flow"/><rect x="722" y="313" width="156" height="25" rx="12" fill="#FAF5EC"/><text x="741" y="331" class="label">HTTPS / JSON</text>
  <path d="M435 452 H500" class="flow"/><text x="442" y="438" class="label">Admin API</text>
  <path d="M1090 452 H1155" class="flow"/><text x="1100" y="438" class="label">Email API</text>

  <rect x="70" y="685" width="330" height="190" rx="28" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="728" class="section">PERSISTENT DATA</text><text x="102" y="765" class="box-title">PostgreSQL</text><text x="102" y="797" class="box-copy">Users · Sessions · Check-ins · Journals</text><text x="102" y="823" class="box-copy">Content · Recommendations · Feedback</text><rect x="102" y="840" width="105" height="28" rx="14" fill="#FFFDFC"/><text x="125" y="859" class="tag">RAILWAY</text>

  <rect x="470" y="685" width="330" height="190" rx="28" fill="#E6E4F1" stroke="#B9B5D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="502" y="728" class="section">PERSONALISATION</text><text x="502" y="765" class="box-title">Python Recommender</text><text x="502" y="797" class="box-copy">Rules · ONNX semantics · Behaviour</text><text x="502" y="823" class="box-copy">Suitability · Diversity · Exclusions</text><rect x="502" y="840" width="105" height="28" rx="14" fill="#FFFDFC"/><text x="525" y="859" class="tag">RAILWAY</text>

  <rect x="870" y="685" width="330" height="190" rx="28" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/>
  <text x="902" y="728" class="section">MEDIA STORAGE</text><text x="902" y="765" class="box-title">S3 / Cloudflare R2</text><text x="902" y="797" class="box-copy">Images · Audio · Video · Course covers</text><text x="902" y="823" class="box-copy">Standalone PDFs and attachments</text><rect x="902" y="840" width="151" height="28" rx="14" fill="#FFFDFC"/><text x="924" y="859" class="tag">OBJECT STORAGE</text>

  <rect x="1270" y="685" width="260" height="190" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/>
  <text x="1302" y="728" class="section">DEVICE SERVICES</text><text x="1302" y="765" class="box-title">Native iOS / Android</text><text x="1302" y="797" class="box-copy">Secure storage</text><text x="1302" y="823" class="box-copy">Notifications · Downloads</text><text x="1302" y="849" class="box-copy">Audio and video playback</text>

  <path d="M680 560 C640 610 400 620 270 675" class="flow"/><text x="387" y="622" class="label">SQL</text>
  <path d="M760 560 C742 620 680 628 650 675" class="flow"/><text x="690" y="622" class="label">Private API</text>
  <path d="M900 560 C930 620 1000 630 1020 675" class="flow"/><text x="951" y="622" class="label">Signed URLs</text>
  <path d="M1090 240 C1330 260 1410 460 1400 675" class="flow-dashed"/><text x="1370" y="590" class="label">Native APIs</text>
  <path d="M1200 748 C1270 660 1300 405 1090 245" class="flow-dashed"/><text x="1223" y="590" class="label">Media GET</text>
  <path d="M435 510 C650 640 815 610 870 748" class="flow-dashed"/><text x="615" y="645" class="label">Direct upload using signed URL</text>

  <text x="80" y="948" class="small">Figure 1. Holistic Mind production architecture. Solid lines represent protected service communication; dashed lines represent direct device or media flows.</text>
</svg>
