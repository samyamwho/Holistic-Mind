<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Holistic Mind User Workflow</title>
  <desc id="desc">End-to-end journey from welcome and authentication through onboarding, check-in, recommendations, practices, journaling, learning, and history.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4E352D" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12z" fill="#805C55"/></marker>
    <style>.title{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}.n{font:800 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9A5B6A}.h{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.p{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7E665D}.flow{fill:none;stroke:#805C55;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#9A7B70;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}.label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#805C55}.caption{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}</style>
  </defs>
  <rect width="1600" height="1050" fill="#FAF5EC"/><circle cx="1510" cy="70" r="190" fill="#EFDADF" opacity=".42"/><circle cx="100" cy="990" r="190" fill="#DDE6D7" opacity=".48"/>
  <text x="70" y="68" class="title">End-to-End User Workflow</text><text x="70" y="104" class="subtitle">A gentle loop from awareness to action, reflection, learning, and return</text>

  <rect x="70" y="160" width="250" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="98" y="193" class="n">01</text><text x="98" y="224" class="h">Welcome</text><text x="98" y="249" class="p">Understand the value</text>
  <rect x="380" y="160" width="250" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="408" y="193" class="n">02</text><text x="408" y="224" class="h">Authenticate</text><text x="408" y="249" class="p">Email or Google sign-in</text>
  <path d="M320 218H370" class="flow"/>

  <path d="M735 160L835 218 735 276 635 218Z" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="690" y="213" class="h">First</text><text x="679" y="238" class="h">session?</text>
  <path d="M630 218H640" class="flow"/>
  <rect x="930" y="145" width="300" height="145" rx="27" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="958" y="181" class="n">03 · FIRST-TIME USER</text><text x="958" y="214" class="h">Personalised Onboarding</text><text x="958" y="241" class="p">Goal · age range · reminder time</text><text x="958" y="265" class="p">Supportive, non-diagnostic language</text>
  <path d="M835 218H920" class="flow"/><text x="860" y="202" class="label">YES</text>

  <rect x="650" y="355" width="360" height="145" rx="30" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/><text x="682" y="392" class="n">04 · DAILY HOME</text><text x="682" y="427" class="h">Home Dashboard</text><text x="682" y="454" class="p">Check-in · suggested tools · progress</text><text x="682" y="478" class="p">One clear next action</text>
  <path d="M1080 290C1080 330 1000 350 970 355" class="flow"/>
  <path d="M735 276V345" class="flow"/><text x="749" y="318" class="label">NO</text>

  <rect x="70" y="590" width="275" height="155" rx="27" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="100" y="627" class="n">05</text><text x="100" y="659" class="h">Daily Check-In</text><text x="100" y="687" class="p">State · body · energy · stress</text><text x="100" y="711" class="p">Focus · requested support</text>
  <rect x="405" y="590" width="275" height="155" rx="27" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="435" y="627" class="n">06</text><text x="435" y="659" class="h">Recommendations</text><text x="435" y="687" class="p">Relevant practices ranked</text><text x="435" y="711" class="p">for the current moment</text>
  <rect x="740" y="590" width="275" height="155" rx="27" fill="#E6E4F1" stroke="#B9B5D0" stroke-width="2" filter="url(#shadow)"/><text x="770" y="627" class="n">07</text><text x="770" y="659" class="h">Complete Practice</text><text x="770" y="687" class="p">Breathing · video · guidance</text><text x="770" y="711" class="p">Timer, pause and completion</text>
  <rect x="1075" y="590" width="275" height="155" rx="27" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="1105" y="627" class="n">08</text><text x="1105" y="659" class="h">Give Feedback</text><text x="1105" y="687" class="p">Better · same · worse</text><text x="1105" y="711" class="p">Improves future relevance</text>
  <path d="M650 445C480 500 250 515 210 580" class="flow"/><path d="M345 668H395" class="flow"/><path d="M680 668H730" class="flow"/><path d="M1015 668H1065" class="flow"/>
  <path d="M1210 580C1170 500 1050 475 1010 445" class="return"/><text x="1110" y="515" class="label">DAILY LOOP</text>

  <text x="70" y="834" class="n">EXPLORE AT THE USER'S OWN PACE</text>
  <rect x="70" y="860" width="300" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="98" y="899" class="h">Explore</text><text x="98" y="925" class="p">Browse somatic and audio folders</text><text x="98" y="948" class="p">Search and choose independently</text>
  <rect x="445" y="860" width="300" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="473" y="899" class="h">Journal</text><text x="473" y="925" class="p">Guided prompts or free writing</text><text x="473" y="948" class="p">Save private reflections</text>
  <rect x="820" y="860" width="300" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="848" y="899" class="h">Library</text><text x="848" y="925" class="p">Courses, modules and chapters</text><text x="848" y="948" class="p">Video · audio · PDF · quizzes</text>
  <rect x="1195" y="860" width="300" height="115" rx="25" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="1223" y="899" class="h">Profile and History</text><text x="1223" y="925" class="p">Trends, reflections and reminders</text><text x="1223" y="948" class="p">Account and privacy controls</text>
  <path d="M760 500C720 790 250 775 220 850" class="return"/><path d="M790 500C790 770 600 790 595 850" class="return"/><path d="M850 500C870 760 970 795 970 850" class="return"/><path d="M900 500C1020 735 1340 780 1340 850" class="return"/>
  <text x="70" y="1020" class="caption">Figure 2. Holistic Mind user workflow. The central daily loop is supported by optional exploration, reflection, education, and longitudinal history.</text>
</svg>
