<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Holistic Mind Recommendation Engine Workflow</title>
  <desc id="desc">Flow from user check-in through authenticated data collection, pseudonymisation, hybrid scoring, ranked recommendations, and feedback.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4E352D" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12z" fill="#805C55"/></marker>
    <style>.title{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}.k{font:800 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:1.5px;fill:#9A5B6A}.h{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5F3B2B}.p{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7E665D}.w{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#76524D}.flow{fill:none;stroke:#805C55;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#9A7B70;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}.caption{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8E756B}</style>
  </defs>
  <rect width="1600" height="1100" fill="#FAF5EC"/><circle cx="1480" cy="90" r="190" fill="#E6E4F1" opacity=".45"/><circle cx="70" cy="1030" r="210" fill="#EFDADF" opacity=".38"/>
  <text x="70" y="68" class="title">Hybrid Recommendation Engine Workflow</text><text x="70" y="104" class="subtitle">Explainable suitability rules, semantic relevance, behaviour, diversity, and a continuous feedback loop</text>

  <rect x="70" y="155" width="300" height="140" rx="28" fill="#FFFDFC" stroke="#D9C6BA" stroke-width="2" filter="url(#shadow)"/><text x="100" y="193" class="k">MOBILE APP</text><text x="100" y="227" class="h">Daily Check-In</text><text x="100" y="255" class="p">Six current-state signals</text><text x="100" y="278" class="p">saved under the signed-in user</text>
  <rect x="470" y="155" width="300" height="140" rx="28" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="500" y="193" class="k">PROTECTED REQUEST</text><text x="500" y="227" class="h">Backend Authentication</text><text x="500" y="255" class="p">POST /recommendations/generate</text><text x="500" y="278" class="p">User identity comes from the token</text>
  <rect x="870" y="155" width="300" height="140" rx="28" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/><text x="900" y="193" class="k">POSTGRESQL</text><text x="900" y="227" class="h">Gather Context</text><text x="900" y="255" class="p">Goal · latest check-in · journals</text><text x="900" y="278" class="p">Exercises · behaviour · exclusions</text>
  <rect x="1270" y="155" width="260" height="140" rx="28" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="1300" y="193" class="k">PRIVACY LAYER</text><text x="1300" y="227" class="h">Pseudonymise</text><text x="1300" y="255" class="p">HMAC user identifier</text><text x="1300" y="278" class="p">No raw database user ID</text>
  <path d="M370 225H460" class="flow"/><path d="M770 225H860" class="flow"/><path d="M1170 225H1260" class="flow"/>

  <rect x="120" y="390" width="1360" height="345" rx="36" fill="#FFFDFC" stroke="#C8B6AC" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="165" y="436" class="k">PYTHON FASTAPI RECOMMENDATION SERVICE</text><text x="165" y="474" class="h">Controlled hybrid ranking pipeline</text>

  <rect x="165" y="520" width="225" height="145" rx="24" fill="#F6ECEE" stroke="#D8B8BF" stroke-width="2"/><text x="190" y="553" class="w">1 · ELIGIBILITY</text><text x="190" y="584" class="h">Filter Candidates</text><text x="190" y="611" class="p">Published content only</text><text x="190" y="635" class="p">Remove uncomfortable items</text>
  <rect x="420" y="520" width="225" height="145" rx="24" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2"/><text x="445" y="553" class="w">2 · 65% WEIGHT</text><text x="445" y="584" class="h">Suitability Rules</text><text x="445" y="611" class="p">State, intensity, breath holds</text><text x="445" y="635" class="p">Goals and contraindications</text>
  <rect x="675" y="520" width="225" height="145" rx="24" fill="#E6E4F1" stroke="#B9B5D0" stroke-width="2"/><text x="700" y="553" class="w">3 · 25% WEIGHT</text><text x="700" y="584" class="h">Semantic Match</text><text x="700" y="611" class="p">Current state plus history</text><text x="700" y="635" class="p">ONNX embeddings</text>
  <rect x="930" y="520" width="225" height="145" rx="24" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2"/><text x="955" y="553" class="w">4 · UP TO 10%</text><text x="955" y="584" class="h">Behaviour Signal</text><text x="955" y="611" class="p">Collaborative component only</text><text x="955" y="635" class="p">when enough evidence exists</text>
  <rect x="1185" y="520" width="225" height="145" rx="24" fill="#F6ECEE" stroke="#D8B8BF" stroke-width="2"/><text x="1210" y="553" class="w">5 · FINAL RANKING</text><text x="1210" y="584" class="h">Diversity and Reason</text><text x="1210" y="611" class="p">Reduce repetition</text><text x="1210" y="635" class="p">Generate explanation</text>
  <path d="M390 593H410" class="flow"/><path d="M645 593H665" class="flow"/><path d="M900 593H920" class="flow"/><path d="M1155 593H1175" class="flow"/>
  <path d="M1400 295C1400 345 1320 365 1280 390" class="flow"/>

  <rect x="150" y="820" width="300" height="150" rx="28" fill="#E7EEE2" stroke="#BBCAB4" stroke-width="2" filter="url(#shadow)"/><text x="180" y="858" class="k">PERSIST RESULTS</text><text x="180" y="892" class="h">Recommendation Record</text><text x="180" y="920" class="p">Request · ranked items · scores</text><text x="180" y="944" class="p">Reasons · impression events</text>
  <rect x="650" y="820" width="300" height="150" rx="28" fill="#F1DFE3" stroke="#CDAAB2" stroke-width="2" filter="url(#shadow)"/><text x="680" y="858" class="k">MOBILE EXPERIENCE</text><text x="680" y="892" class="h">“For You Right Now”</text><text x="680" y="920" class="p">Four ranked exercise cards</text><text x="680" y="944" class="p">with a relevant reason</text>
  <rect x="1150" y="820" width="300" height="150" rx="28" fill="#F1E5D3" stroke="#D5BE9A" stroke-width="2" filter="url(#shadow)"/><text x="1180" y="858" class="k">LEARNING LOOP</text><text x="1180" y="892" class="h">Activity and Feedback</text><text x="1180" y="920" class="p">Open · start · complete · repeat</text><text x="1180" y="944" class="p">Better · same · worse · uncomfortable</text>
  <path d="M800 735C700 780 420 770 350 810" class="flow"/><path d="M450 895H640" class="flow"/><path d="M950 895H1140" class="flow"/>
  <path d="M1300 810C1320 760 1460 700 1440 650" class="feedback"/><text x="1360" y="764" class="w">FUTURE REQUESTS</text>

  <rect x="520" y="1000" width="560" height="38" rx="19" fill="#EFE4D5"/><text x="562" y="1025" class="w">RESILIENCE: deterministic local recommendations remain available if the service is unavailable</text>
  <text x="70" y="1072" class="caption">Figure 3. Recommendation generation and feedback workflow. Weighting values represent the implemented hybrid scoring design.</text>
</svg>
